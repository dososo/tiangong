<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script type="module">
import { Engine, defaultEnv } from './src/core/engine.js'; import { buildWorld } from './src/world/world.js'; import { populate } from './src/world/life.js'; import { buildStack } from './src/world/stack.js'; import { m4, v3, DEG } from './src/core/math.js';
let E, W; const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) { a[k] ??= {}; merge(a[k], b[k]); } else a[k] = b[k]; } return a; };
window.init = async (w, h) => { const t = performance.now(); E = new Engine(document.getElementById('c'), w, h, { preserve: true }); W = buildWorld(E); populate(W, E); buildStack(W, E); window.E = E; window.W = W; const n = E.groups.reduce((s, g) => s + g.inst.length, 0); console.log('world', W.ms | 0, 'ms; total', performance.now() - t | 0, 'instances', n); console.log(E.groups.filter(g=>g.lods[0].cam.tris>20000).map(g => g.name + ':' + g.lods.map(l => Math.round(l.cam.tris)).join('/')).join(' ')); };
window.look = (o) => { W.stack.show(!!o.stack); W.life.update(o.t || 0); W.life.show(o.show || {}); if (o.door !== undefined) W.setDoors(o.door); if (o.monkey) W.life.setMonkey(...o.monkey); if (o.petal) { W.life.petal.ext = o.petal; W.life.petal.vis = true; } if (o.dust) { W.life.dust.ext = o.dust; W.life.dust.vis = true; } const env = merge(defaultEnv(), o.env || {}); W.sun.m = m4.trs(env.sun.pos, 0, env.sun.radius); W.sun.c = env.sun.pos; W.sun.dat = [0, 0, env.sun.glow ?? 20, env.sun.crow ?? 1]; W.sun.vis = env.sun.disc !== false; const mo = env.moon; W.moon.vis = !!mo; if (mo) { W.moon.m = m4.trs(mo.pos, mo.ry || 0, mo.r); W.moon.c = mo.pos; W.moon.dat = [0, 0, mo.glow ?? 1, 0]; }
  const tr = performance.now(); E.render({ t: o.t || 0, spp: o.spp || 4, q: o.q || {}, seed: 1, frame: () => ({ cam: { ...o.cam, fov: (o.cam.fov || 38) * DEG }, env }) }); const px = new Uint8Array(4); E.gl.readPixels(0, 0, 1, 1, E.gl.RGBA, E.gl.UNSIGNED_BYTE, px); console.log(o.name || '', 'render', performance.now() - tr | 0, 'ms tris', (E.stats.tris / 1e6).toFixed(2) + 'M', (E.stats.trisShadow / 1e6).toFixed(2) + 'M', 'err', E.gl.getError()); return document.getElementById('c').toDataURL(o.jpg ? 'image/jpeg' : 'image/png', .92); };
</script>
